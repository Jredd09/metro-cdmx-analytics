name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metro
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metro
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build database (every row passes the schema's constraints)
        run: python -m metro_analytics build
      - name: Data-quality audit
        run: python -m metro_analytics audit
      - name: Analysis
        run: python -m metro_analytics analyze --recovery-seeds 3
      - name: SQL business queries
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f sql/04_business_queries.sql > /dev/null
      - name: Tests
        run: pytest -q
